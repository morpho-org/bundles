[profile.default]
ignored_warnings_from = ["lib"]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
via_ir = true
optimizer = true
optimizer_runs = 4294967295
evm_version = "osaka"
bytecode_hash = "none"

[lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]

[[profile.default.additional_compiler_profiles]]
name = "paris-999999"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.additional_compiler_profiles]]
name = "osaka-466"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.additional_compiler_profiles]]
name = "cancun-100000"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.additional_compiler_profiles]]
name = "paris-200"
evm_version = "paris"
optimizer_runs = 200

[[profile.default.additional_compiler_profiles]]
name = "london-1000000"
evm_version = "london"
optimizer_runs = 1000000

[[profile.default.compilation_restrictions]]
paths = "test/imports/BlueImport.sol"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.compilation_restrictions]]
paths = "test/imports/MidnightImport.sol"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.compilation_restrictions]]
paths = "test/imports/VaultImport.sol"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.compilation_restrictions]]
paths = "test/imports/MetaMorphoImport.sol"
evm_version = "paris"
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "test/imports/Permit2Import.sol"
evm_version = "london"
optimizer_runs = 1000000
