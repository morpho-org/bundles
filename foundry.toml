[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
via_ir = true
optimizer = true
optimizer_runs = 4294967295
evm_version = "osaka"
bytecode_hash = "none"

[lint]
exclude_lints = [
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
    "boolean-cst",
]

# Lint profile for test/: the base list in full, plus the rules that only fire in
# test/. A profile replaces exclude_lints rather than extending it, hence the repeat.
# Starting point to be trimmed, the bug-class rules first.
[profile.lint-test.lint]
exclude_lints = [
    # Base [lint] list, repeated in full.
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
    "boolean-cst",
    # Additionally firing under test/.
    "reentrancy-events",
    "divide-before-multiply",
    "missing-inheritance",
    "reentrancy-no-eth",
    "unsafe-typecast",
    "function-init-state",
    "uninitialized-state",
    "missing-events-access-control",
    "uninitialized-local",
    "named-struct-fields",
    "empty-block",
    "ecrecover",
    "boolean-equal",
    "encode-packed-collision",
    "arbitrary-send-eth",
    "locked-ether",
]

[[profile.default.additional_compiler_profiles]]
name = "paris-999999"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.additional_compiler_profiles]]
name = "osaka-466"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.additional_compiler_profiles]]
name = "cancun-100000"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.additional_compiler_profiles]]
name = "paris-200"
evm_version = "paris"
optimizer_runs = 200

[[profile.default.additional_compiler_profiles]]
name = "london-1000000"
evm_version = "london"
optimizer_runs = 1000000

[[profile.default.compilation_restrictions]]
paths = "test/imports/BlueImport.sol"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.compilation_restrictions]]
paths = "test/imports/MidnightImport.sol"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.compilation_restrictions]]
paths = "test/imports/VaultImport.sol"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.compilation_restrictions]]
paths = "test/imports/MetaMorphoImport.sol"
evm_version = "paris"
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "test/imports/Permit2Import.sol"
evm_version = "london"
optimizer_runs = 1000000
