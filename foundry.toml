[profile.default]
ignored_error_codes_from = [["test", ["code-size", "init-code-size"]]]
ignored_warnings_from = ["lib"]
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 4294967295
evm_version = "osaka"
bytecode_hash = "none"

[profile.default.fuzz]
runs = 1024

[lint]
severity = ["high", "medium", "low", "info"]
exclude_lints = [
    "arbitrary-send-erc20",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "cyclomatic-complexity",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "require-revert-in-loop",
    "screaming-snake-case-immutable",
    "too-many-digits",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unused-return",
]

[[profile.default.additional_compiler_profiles]]
name = "paris-999999"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.additional_compiler_profiles]]
name = "osaka-466"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.additional_compiler_profiles]]
name = "cancun-100000"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.additional_compiler_profiles]]
name = "paris-200"
evm_version = "paris"
optimizer_runs = 200

[[profile.default.additional_compiler_profiles]]
name = "london-1000000"
evm_version = "london"
optimizer_runs = 1000000

[[profile.default.compilation_restrictions]]
paths = "test/imports/BlueImport.sol"
evm_version = "paris"
optimizer_runs = 999999

[[profile.default.compilation_restrictions]]
paths = "test/imports/MidnightImport.sol"
evm_version = "osaka"
optimizer_runs = 466

[[profile.default.compilation_restrictions]]
paths = "test/imports/VaultImport.sol"
evm_version = "cancun"
optimizer_runs = 100000

[[profile.default.compilation_restrictions]]
